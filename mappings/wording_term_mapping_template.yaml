version: "0.1"
name: "wording_term_mapping_template"
description: "Template for mapping wording terms and document labels to canonical ontology fields"

mapping_template:
  mapping_id: ""
  document_type: ""
  jurisdiction: "UK"
  product_line: ""
  canonical_entity_name: ""
  canonical_field_path: ""
  canonical_definition: ""
  source_term: ""
  source_term_variant: ""
  extraction_context: ""
  mapped_value: ""
  transformation_rule: ""
  ambiguity_flag: false
  ambiguity_note: ""
  confidence_rule: ""
  validation_rule: ""
  notes: ""

examples:
  - mapping_id: "MOTOR_WORDING_001"
    document_type: "policy_wording"
    jurisdiction: "UK"
    product_line: "motor"
    canonical_entity_name: "motor_coverage"
    canonical_field_path: "coverage.windscreen_included"
    canonical_definition: "Indicates whether windscreen cover is included under the motor policy"
    source_term: "Windscreen Cover"
    source_term_variant: "Glass cover"
    extraction_context: "Coverage section within policy wording"
    mapped_value: "true"
    transformation_rule: "If wording states included, covered, or provided, map to true"
    ambiguity_flag: false
    ambiguity_note: ""
    confidence_rule: "High confidence where heading and coverage text align"
    validation_rule: "Check whether cover is standard or optional"
    notes: "May appear as a separate subsection"

  - mapping_id: "HOME_WORDING_001"
    document_type: "schedule"
    jurisdiction: "UK"
    product_line: "home"
    canonical_entity_name: "home_coverage"
    canonical_field_path: "coverage.accidental_damage_included"
    canonical_definition: "Indicates whether accidental damage cover is included"
    source_term: "Accidental Damage"
    source_term_variant: "Accidental Damage Cover"
    extraction_context: "Schedule table or optional cover summary"
    mapped_value: "true"
    transformation_rule: "Map yes, included, covered to true"
    ambiguity_flag: true
    ambiguity_note: "May apply only to buildings, only to contents, or both"
    confidence_rule: "Medium confidence unless section scope is explicit"
    validation_rule: "Confirm whether scope is buildings, contents, or combined"
    notes: "Do not assume it applies to all sections unless stated"

  - mapping_id: "COMM_PROP_WORDING_001"
    document_type: "policy_wording"
    jurisdiction: "UK"
    product_line: "commercial_property"
    canonical_entity_name: "business_interruption"
    canonical_field_path: "business_interruption.indemnity_period_months"
    canonical_definition: "Length of business interruption indemnity period in months"
    source_term: "Indemnity Period"
    source_term_variant: "Maximum Indemnity Period"
    extraction_context: "Business interruption section"
    mapped_value: "12"
    transformation_rule: "Extract numeric month value where explicitly stated"
    ambiguity_flag: false
    ambiguity_note: ""
    confidence_rule: "High confidence where numeric term is adjacent to business interruption cover"
    validation_rule: "Must match allowed months or be classified as other"
    notes: "Often appears in schedule and wording"

  - mapping_id: "PENSIONS_WORDING_001"
    document_type: "member_statement"
    jurisdiction: "UK"
    product_line: "pensions"
    canonical_entity_name: "pension_benefit"
    canonical_field_path: "pension_benefit.projected_value"
    canonical_definition: "Projected retirement benefit value based on current assumptions"
    source_term: "Projected annual income"
    source_term_variant: "Estimated retirement income"
    extraction_context: "Annual member statement benefit summary"
    mapped_value: ""
    transformation_rule: "Extract numeric currency value and store as decimal"
    ambiguity_flag: true
    ambiguity_note: "Projection basis may vary by provider and assumptions"
    confidence_rule: "Medium confidence if clear monetary value is shown"
    validation_rule: "Must be numeric and linked to the relevant projection label"
    notes: "Projection assumptions should be captured separately where possible"
